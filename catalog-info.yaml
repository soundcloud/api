apiVersion: backstage.io/v1alpha1
kind: Component
spec:
  type: external_service
  lifecycle: production
  owner: api-team
  dependsOn:
    - Component:api-public
    - Component:counts-api
    - Component:system-playlists
  consumesApis:
    - authenticator-authenticator_access_grant_exchange.proto
    - comments-comments.proto
    - counts-api-counts_api.proto
    - gatekeeper-gatekeeper_api.proto
    - hocuspocus-hocuspocus.proto
    - likes-likes_api.proto
    - likes_api_v2.proto
    - playlists-playlists_api.proto
    - profiles-profiles_api.proto
    - tracks-tracks_api.proto
    - search-search_api.proto
    - follows-follows_api.proto
metadata:
  name: api-public-asset-uploads
  description: Preprocessor for multipart requests (track uploads)
  links:
    - url: https://grafana.soundcloud.org/dashboard/db/jvmkit-generic?var-prometheus=api-public&var-system=api-public&var-job=api-public
      title: Telemetry
      link: dashboard
    - url: https://eng-doc.soundcloud.org/runbooks/api/api-public/
      title: Runbook
      link: alert
  annotations:
    github.com/project-slug: soundcloud/api-public
    'backstage.io/kubernetes-id': api-public
    'backstage.io/kubernetes-namespace': api-public
    'backstage.io/kubernetes-label-selector': 'system=api-public,component=asset-uploads-api'
---
apiVersion: backstage.io/v1alpha1
kind: Component
spec:
  type: external_service
  lifecycle: production
  owner: api-team
  dependsOn:
    - Component:api-public
    - Component:api-public-asset-uploads
metadata:
  name: api-public-doc
  description: Swagger UI for API Public
  links:
    - url: https://grafana.soundcloud.org/dashboard/db/jvmkit-generic?var-prometheus=api-public&var-system=api-public&var-job=api-public
      title: Telemetry
      link: dashboard
    - url: https://eng-doc.soundcloud.org/runbooks/api/api-public/
      title: Runbook
      link: alert
    - url: mailto:api-team@soundcloud.com
      title: Contact Email
      link: help
  annotations:
    github.com/project-slug: soundcloud/api-public
    'backstage.io/kubernetes-id': api-public
    'backstage.io/kubernetes-namespace': api-public
    'backstage.io/kubernetes-label-selector': 'system=api-public,component=doc'
    soundcloud.com/contact-channel: api-team-alerts
---
