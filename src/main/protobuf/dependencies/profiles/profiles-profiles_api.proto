/* associate a track with a profile.
   track_urn: urn of a track that exists in the mothership tracks table
   profile_urn: urn of a user that exists in the mothership users table
   use_track_published_or_created_at:
     - if true, the track published_or_created_at time is used as the time the track moved to the new profile. this
       is useful for fixing cases where a track exists but there is no profile association for it.
     - if false (the default) the server's current time is used as the time the track moved to the new profile
 */
message CreateTrackProfileAssociationRequest {
    proto.soundcloud.common.session.UserSession user_session = 1;
    string track_urn = 2;
    string profile_urn = 3;
    bool use_track_published_or_created_at = 4;
    bool force_move_non_agp = 5;
}

message CreateTrackProfileAssociationResponse { }

