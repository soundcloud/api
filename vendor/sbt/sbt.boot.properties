[scala]
  version: ${sbt.scala.version-auto}

[app]
  org: ${sbt.organization-org.scala-sbt}
  name: sbt
  version: ${sbt.version-read(sbt.version)[0.12.0]}
  class: ${sbt.main.class-sbt.xMain}
  components: xsbti,extra
  cross-versioned: ${sbt.cross.versioned-false}

[repositories]
  local
  sc-hosted-snapshots: http://maven.int.s-cloud.net/content/groups/hosted_snapshots/, [organization]/[module]/[revision]/[type]s/[artifact](-[classifier]).[ext]
  sc-hosted-releases: http://maven.int.s-cloud.net/content/groups/hosted_releases/, [organization]/[module]/[revision]/[type]s/[artifact](-[classifier]).[ext]
  sc-proxy-snapshots: http://maven.int.s-cloud.net/content/groups/proxy_snapshots/, [organization]/[module]/[revision]/[type]s/[artifact](-[classifier]).[ext]
  sc-proxu-releases: http://maven.int.s-cloud.net/content/groups/proxy_releases/, [organization]/[module]/[revision]/[type]s/[artifact](-[classifier]).[ext]

[boot]
 directory: ${sbt.boot.directory-${sbt.global.base-${user.home}/.sbt}/boot/}

[ivy]
  ivy-home: ${sbt.ivy.home-${user.home}/.ivy2/}
  checksums: ${sbt.checksums-sha1,md5}
  override-build-repos: ${sbt.override.build.repos-false}
  repository-config: ${sbt.repository.config-${sbt.global.base-${user.home}/.sbt}/repositories}
