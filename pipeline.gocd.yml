---
format_version: 2
pipelines:
  public-api-strangler:
    group: core-services
    label_template: "${COUNT}-${git[:7]}"
    materials:
      git:
        git: git@github.com:soundcloud/public-api-strangler.git
    stages:
    - test:
        jobs:
          unit-tests-and-publish:
            tasks:
            - exec:
                command: make
                arguments:
                - unit-test
            - exec:
                command: make
                arguments:
                - package
            - exec:
                command: make
                arguments:
                - publish
                - publish-deploy
            - exec:
                command: make
                arguments:
                - contract-upload
    - end-to-end-tests:
        jobs:
          end-to-end-tests:
            tasks:
            - exec:
                command: make
                arguments:
                - end-to-end-test
    - promote-to-stable:
        jobs:
          promote-to-stable:
            tasks:
            - exec:
                command: make
                arguments:
                - promote-to-stable
    - deploy-canary:
        jobs:
          deploy-api-canary:
            job_type: deploy
            tasks:
            - exec:
                command: make
                arguments:
                - deploy-k8s-api-canary
            - exec:
                command: make
                arguments:
                - scale-down-api-canary
            - exec:
                run_if: failed
                command: make
                arguments:
                - scale-down-api-canary
          deploy-apitrackupload-canary:
            job_type: deploy
            tasks:
            - exec:
                command: make
                arguments:
                - deploy-k8s-apitrackupload-canary
            - exec:
                command: make
                arguments:
                - scale-down-apitrackupload-canary
            - exec:
                run_if: failed
                command: make
                arguments:
                - scale-down-apitrackupload-canary
    - deploy-to-production:
        jobs:
          promote-to-release-then-deploy:
            job_type: deploy
            tasks:
            - exec:
                command: make
                arguments:
                - promote-to-release
            - exec:
                command: make
                arguments:
                - deploy-k8s-api
            - exec:
                command: make
                arguments:
                - deploy-k8s-apitrackupload
    - promote-contract-tests:
        jobs:
          promote-tests:
            tasks:
            - exec:
                command: make
                arguments:
                - contract-promote
