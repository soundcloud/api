version: '3'
services:
  echo_service:
    image: docker.dev.s-cloud.net/go-1:latest
    ports:
      - 9090:9090
    volumes:
      - ../testdata:/srv/test:ro
    working_dir: /srv/test
    command: go run echo_service.go -listenAddr=:9090
  moshimoshi_service:
    image: docker.dev.s-cloud.net/go-1:latest
    ports:
      - 9091:9091
    volumes:
      - ../testdata:/srv/test:ro
    working_dir: /srv/test
    command: go run moshimoshi_service.go -listenAddr=:9091
