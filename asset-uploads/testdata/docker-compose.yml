version: '3'

services:
  asset_uploads:
    image: docker.dev.s-cloud.net/public-api-strangler-asset-uploads:$TAG
    depends_on:
      - moshimoshi
      - public_api_strangler
    command: ./api --config=api-test
    environment:
      https_proxy: 'http://proxy.dev.s-cloud.net:3128'
      no_proxy: '.s-cloud.net'

  moshimoshi:
    image: docker.dev.s-cloud.net/go-1:latest
    volumes:
      - ../testdata:/srv/test:ro
    working_dir: /srv/test
    command: go run moshimoshi_service.go -listenAddr=:80

  public_api_strangler:
    image: docker.dev.s-cloud.net/go-1:latest
    volumes:
      - ../testdata:/srv/test:ro
    working_dir: /srv/test
    command: go run echo_service.go -listenAddr=:80
