version: '3'

services:
  asset_uploads:
    image: ${SC_DOCKER_REPO}/public-api-strangler-asset-uploads:$TAG
    depends_on:
      - media_service
      - public_api_strangler
    command: ./api --config=api-test
    environment:
      https_proxy: 'http://proxy.localproxy.sc:42043'
    extra_hosts:
      - proxy.localproxy.sc:host-gateway

  media_service:
    image: ${SC_DOCKER_REPO}/go-1:latest
    volumes:
      - ../testdata:/srv/test:ro
    working_dir: /srv/test
    command: go run media_service.go -listenAddr=:80

  public_api_strangler:
    image: ${SC_DOCKER_REPO}/go-1:latest
    volumes:
      - ../testdata:/srv/test:ro
    working_dir: /srv/test
    command: go run echo_service.go -listenAddr=:80
