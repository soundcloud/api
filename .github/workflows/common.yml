---
name: api-public
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        description: 'The ref that triggered the workflow'
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
concurrency:
  group: "${{ github.workflow }}-${{ inputs.ref }}-${{ github.run_number }}-common"
jobs:
  call_api_public_test:
    name: call test workflow
    uses: "./.github/workflows/test.yml"
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
  call_api_public_end_to_end_tests:
    name: call end-to-end-tests workflow
    uses: "./.github/workflows/end-to-end-tests.yml"
    secrets: inherit
    needs: call_api_public_test
    with:
      ref: ${{ inputs.ref }}
  call_api_public_publish_deploy:
    name: call publish-deploy workflow
    uses: "./.github/workflows/publish-deploy.yml"
    secrets: inherit
    needs: call_api_public_end_to_end_tests
    with:
      ref: ${{ inputs.ref }}
  call_api_public_promote_to_stable:
    name: call promote-to-stable workflow
    uses: "./.github/workflows/promote-to-stable.yml"
    secrets: inherit
    needs: call_api_public_publish_deploy
    with:
      ref: ${{ inputs.ref }}
  call_api_public_canary:
    name: call canary workflow
    uses: "./.github/workflows/canary.yml"
    secrets: inherit
    needs: call_api_public_promote_to_stable
    with:
      ref: ${{ inputs.ref }}
  call_api_public_deploy_to_production:
    name: call deploy-to-production workflow
    uses: "./.github/workflows/deploy-to-production.yml"
    secrets: inherit
    needs: call_api_public_canary
    with:
      ref: ${{ inputs.ref }}
  call_api_public_trigger_gha_workflows:
    name: call trigger-gha-workflows workflow
    uses: "./.github/workflows/trigger-gha-workflows.yml"
    secrets: inherit
    needs: call_api_public_deploy_to_production
    with:
      ref: ${{ inputs.ref }}
  call_api_public_deploy_doc:
    name: call deploy-doc workflow
    uses: "./.github/workflows/deploy-doc.yml"
    secrets: inherit
    needs: call_api_public_deploy_to_production
    with:
      ref: ${{ inputs.ref }}
  call_api_public_publish_release:
    name: call publish-release workflow
    uses: "./.github/workflows/publish-release.yml"
    secrets: inherit
    needs: call_api_public_deploy_doc
    with:
      ref: ${{ inputs.ref }}
  call_api_public_deploy_prometheus:
    name: call deploy-prometheus workflow
    uses: "./.github/workflows/deploy-prometheus.yml"
    secrets: inherit
    needs: call_api_public_publish_release
    with:
      ref: ${{ inputs.ref }}
