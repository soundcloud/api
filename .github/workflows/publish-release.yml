---
name: publish-release
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        description: 'Git ref to publish (branch, tag, or full commit SHA)'
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
concurrency:
  group: "${{ github.workflow }}-${{ inputs.ref }}-publish-release"
jobs:
  publish-release:
    runs-on:
    - self-hosted
    - i-build-prod
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        ref: master
    - name: Set up sc-tools
      uses: soundcloud/sc-github-actions/sc-tools@master
    - name: publish release notes and OpenAPI
      env:
        GH_TOKEN: ${{ secrets.SC_GITHUB_BOT_PAT }}
        REF: ${{ inputs.ref }}
      run: |
        COMMIT=$(git rev-parse "$REF^{commit}")
        git checkout "$COMMIT" -- RELEASE_NOTES.md doc
        if git cat-file -e "$COMMIT:publish/openapi-README.md" 2>/dev/null; then
          git checkout "$COMMIT" -- publish
        fi
        git diff-index --exit-code "${COMMIT}~1" RELEASE_NOTES.md && echo 'No release notes to publish...' && exit 0
        sc crun nodejs-18 -- bash -c "cd doc && npm ci && ./node_modules/.bin/multi-file-swagger -o yaml api.yaml > compiled_api.yaml"
        ./scripts/release
