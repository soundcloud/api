---
name: publish-release
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        description: 'The ref that triggered the workflow'
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
concurrency:
  group: "${{ github.workflow }}-${{ inputs.ref }}-publish-release"
jobs:
  publish-release:
    runs-on:
    - self-hosted
    - i-build-prod
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: make publish-changelog
      env:
        GH_TOKEN: ${{ secrets.SC_GITHUB_BOT_PAT }}
      run: make publish-changelog
