---
name: api-public-publish-release
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-publish-release"
jobs:
  publish-release:
    runs-on:
    - self-hosted
    - i-build-prod
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: make publish-changelog
      env:
        GH_TOKEN: ${{ secrets.SC_GITHUB_BOT_PAT }}
      run: make publish-changelog
