---
name: api-public-deploy-prometheus
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-deploy-prometheus"
jobs:
  deploy-db:
    env:
      ZONES: db
    environment: deploy-prometheus
    runs-on:
    - self-hosted
    - i-deploy-prod
    steps:
    - name: sc-setup
      uses: soundcloud/sc-github-actions/sc-setup@master
      with:
        sc-tools: 'true'
    - name: make deploy-prometheus
      run: make deploy-prometheus
  deploy-replicas:
    env:
      ZONES: replicas
    environment: deploy-prometheus
    runs-on:
    - self-hosted
    - i-deploy-prod
    steps:
    - name: sc-setup
      uses: soundcloud/sc-github-actions/sc-setup@master
      with:
        sc-tools: 'true'
    - name: make deploy-prometheus
      run: make deploy-prometheus
