---
name: asset-uploads-publish-deploy
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        description: 'The ref that triggered the workflow'
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
concurrency:
  group: "${{ github.workflow }}-${{ inputs.ref }}-publish-deploy"
jobs:
  publish-deploy-db:
    env:
      ENV: production
      ZONES: primary,replicas
    runs-on:
    - self-hosted
    - i-deploy-prod
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - name: Set up sc-tools
      uses: soundcloud/sc-github-actions/sc-tools@master
    - name: make -C asset-uploads publish-deploy
      run: make -C asset-uploads publish-deploy
