---
name: api-public-asset-uploads-test
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-test"
jobs:
  run-tests-and-publish:
    runs-on:
    - self-hosted
    - i-build-prod
    steps:
    - name: sc-setup
      uses: soundcloud/sc-github-actions/sc-setup@master
      with:
        sc-tools: 'true'
    - name: make -C asset-uploads test
      run: make -C asset-uploads test
    - name: make -C asset-uploads publish
      run: make -C asset-uploads publish
