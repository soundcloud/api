---
name: api-public-canary
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-canary"
jobs:
  canary-api:
    env:
      ZONES: db
    runs-on:
    - self-hosted
    - i-deploy-prod
    steps:
    - name: sc-setup
      uses: soundcloud/sc-github-actions/sc-setup@master
      with:
        sc-tools: 'true'
    - name: make canary-api
      run: make canary-api
