---
name: deploy-prometheus
env:
  SC_PIPELINE_GROUP: api-team
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        description: 'The ref that triggered the workflow'
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
concurrency:
  group: "${{ github.workflow }}-${{ inputs.ref }}-deploy-prometheus"
jobs:
  deploy-db:
    env:
      ZONES: db
    environment: deploy-prometheus
    runs-on:
    - self-hosted
    - i-deploy-prod
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - name: Set up sc-tools
      uses: soundcloud/sc-github-actions/sc-tools@master
    - name: make deploy-prometheus
      run: make deploy-prometheus
  deploy-replicas:
    env:
      ZONES: replicas
    environment: deploy-prometheus
    runs-on:
    - self-hosted
    - i-deploy-prod
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - name: Set up sc-tools
      uses: soundcloud/sc-github-actions/sc-tools@master
    - name: make deploy-prometheus
      run: make deploy-prometheus
