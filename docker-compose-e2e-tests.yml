services:
  zookeeper:
    image: docker.localproxy.sc:42042/sc-zookeeper:latest-${HOSTARCH}
    ports:
      - 2181:2181

  # This container is only ever used by tests.
  apipublic:
    image: docker.localproxy.sc:42042/api-public:$VERSION
    command: bash -lex -c "./api --config=$CONFIG"
    healthcheck:
       test: [ "CMD", "curl", "-f", "http://localhost:5001/-/health" ]
       interval: 5s
       timeout: 10s
       retries: 30
    ports:
      - 5000:5000
      - 5001:5001
    depends_on:
      - zookeeper

  asset-uploads:
    image: docker.localproxy.sc:42042/api-public-asset-uploads:$VERSION
    command: ./api --config=api-contract-test
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5005/-/health" ]
      interval: 5s
      timeout: 10s
      retries: 30
    ports:
      - 5005:5005
    depends_on:
      - apipublic
    environment:
      https_proxy: 'http://proxy.localproxy.sc:42043'
    extra_hosts:
      - proxy.localproxy.sc:host-gateway
