version: '2.3'

services:
  memcached:
    image: docker.localproxy.sc:42042/sc-memcached:release
    container_name: strangler_memcached
    ports:
      - "11211:11211"

  zookeeper:
    image: docker.localproxy.sc:42042/sc-zookeeper
    container_name: strangler_zk
    ports:
      - "2181:2181"

  # This container is only ever used by tests.
  publicapistrangler:
    image: docker.localproxy.sc:42042/public-api-strangler:$VERSION
    command: bash -lex -c "./api --config=$CONFIG"
    ports:
      - "5000:5000"
      - "5001:5001"
    links:
      - zookeeper:zookeeper
      - memcached:memcached

  asset-uploads:
    image: docker.localproxy.sc:42042/public-api-strangler-asset-uploads:$VERSION
    command: ./api --config=api-contract-test
    ports:
      - "5005:5005"
    links:
      - publicapistrangler:publicapistrangler
    environment:
      https_proxy: 'http://proxy.localproxy.sc:42043'
    extra_hosts:
      - proxy.localproxy.sc:host-gateway
