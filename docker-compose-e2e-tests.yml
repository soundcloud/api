---
memcached:
  image: memcached
  container_name: strangler_memcached
  ports:
    - "11211:11211"

zookeeper:
  image: docker.dev.s-cloud.net/sc-zookeeper
  container_name: strangler_zk
  ports:
    - "2181:2181"

# This container is only ever used by tests.
publicapistrangler:
  image: docker.dev.s-cloud.net/public-api-strangler:${PUBLIC_API_STRANGLER_VERSION}
  container_name: strangler_api
  command: bash -lex -c "./api --config=e2e"
  ports:
    - "5000:5000"
    - "5001:5001"
  links:
    - memcached:memcached
    - zookeeper:zookeeper
    - publicapistub:publicapistub

publicapistub:
  image: docker.dev.s-cloud.net/ruby-2.3
  command: bash -ex -c "gem install sinatra --no-document ; ruby /tmp/pas/tools/public-api-stub.rb"
  volumes:
    - .:/tmp/pas
  ports:
    - "4567:4567"
