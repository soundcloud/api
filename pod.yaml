containers:
- name: "{{ component }}"
  image: "{{ image }}"
  command: {{ cmd }}
  env:
  - name: PORT
    value: "80"
  - name: TELE_PORT
    value: "8080"
  ports:
  - name: http
    containerPort: 80
  - name: telemetry
    containerPort: 8080
  resources:
    requests:
      memory: {{ get "MEMORY_REQUEST" }}
      cpu: 1
    limits:
      memory: {{ get "MEMORY_LIMIT" }}
  readinessProbe:
    httpGet:
      path: /-/health
      port: 80
    initialDelaySeconds: 20
    timeoutSeconds: 1
  livenessProbe:
    httpGet:
      path: /-/health
      port: 80
    initialDelaySeconds: 300
    timeoutSeconds: 10
  volumeMounts:
  - mountPath: /tmp
    name: tmp
  securityContext:
    readOnlyRootFS: true
volumes:
  - name: tmp
    emptyDir: {}
# To allow track uploads to finish, raise the termination grace period
terminationGracePeriodSeconds: 180
