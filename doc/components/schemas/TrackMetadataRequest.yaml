type: object
properties:
  track:
    type: object
    properties:
      title:
        type: string
      permalink:
        type: string
      sharing:
        type: string
        enum:
          - public
          - private
        default: public
      embeddable_by:
        type: string
        enum:
          - all
          - me
          - none
        description: 'who can embed this track "all", "me", or "none"'
      purchase_url:
        type: string
      description:
        type: string
      genre:
        type: string
      tag_list:
        type: string
        description: "The tag_list property contains a list of tags separated by spaces. Multiword tags are quoted in double quotes. We also support machine tags that follow the pattern NAMESPACE:KEY=VALUE. For example: geo:lat=43.555
                camel:size=medium
                “machine:tag=with space”
                Machine tags are not revealed to the user on the track pages."
      label_name:
        type: string
      release:
        type: string
      release_date:
        title: write only!
        type: string
        description: string, formatted as yyyy-mm-dd, representing release date
      streamable:
        type: boolean
        default: true
      downloadable:
        type: boolean
        default: true
      license:
        type: string
        enum:
          - no-rights-reserved
          - all-rights-reserved
          - cc-by
          - cc-by-nc
          - cc-by-nd
          - cc-by-sa
          - cc-by-nc-nd
          - cc-by-nc-sa
        description: 'Possible values: no-rights-reserved, all-rights-reserved, cc-by, cc-by-nc, cc-by-nd, cc-by-sa, cc-by-nc-nd, cc-by-nc-sa'
      commentable:
        type: boolean
        default: true
      reveal_stats:
        type: boolean
        description: When false (quiet mode), play and favorite counts are hidden.
      reveal_comments:
        type: boolean
        description: When false (quiet mode), comments are hidden.
      isrc:
        type: string
      metadata_artist:
        type: string
        description: Optional artist name, when different from user. Use this field in JSON PUT requests (or track[metadata_artist] in multipart PUT requests); use track[artist] in multipart POST uploads.
