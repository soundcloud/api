type: object
description: |
  Creates or updates the storefront (Artist Storefront / buy module) of a track. The request
  replaces the whole storefront - omitted optional fields are cleared, so always send every
  value the storefront should keep.
required:
  - title
  - type
  - link
properties:
  title:
    type: string
    maxLength: 100
    description: Card title shown on the storefront module.
    example: Download now
  type:
    type: string
    enum:
      - digital
      - vinyl
      - cd
      - cassette
      - apparel
      - sample_pack
      - subscription
      - live_event
      - live_stream
      - other
    description: The type of item offered.
  link:
    type: string
    maxLength: 255
    description: External http(s) URL the storefront button opens.
    example: https://example.com/my-track
  link_title:
    type: string
    maxLength: 50
    description: Label of the storefront button. Omit to clear.
    example: Download
  description:
    type: string
    maxLength: 500
    description: Description shown on the storefront module. Omit to clear.
    example: Get the track original files for free.
  price:
    type: string
    maxLength: 20
    description: Display-only price text shown next to the item type. No payment is processed by SoundCloud. Omit to clear.
    example: "0"
