type: object
description: User's activities.
properties:
  collection:
    type: array
    items:
      type: object
      required:
        - type
        - created_at
        - origin
      properties:
        type:
          description: |
            Type of activity (e.g. `track`, `track:repost`, `playlist`, `playlist:repost`).
            For `track:repost` and `playlist:repost`, the API also returns a top-level string field
            `reposter` with the URN of the user who reposted.
          type: string
        created_at:
          description: Created timestamp.
          type: string
        origin:
          description: Origin (track or playlist).
          anyOf:
            - $ref: "#/components/schemas/Track"
            - $ref: "#/components/schemas/Playlist"
  next_href:
    type: string
  future_href:
    type: string