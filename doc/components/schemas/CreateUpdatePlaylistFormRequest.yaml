type: object
properties:
  playlist[title]:
    type: string
  playlist[sharing]:
    type: string
    enum:
      - public
      - private
    default: public
  playlist[description]:
    type: string
  playlist[tracks][][urn]:
    type: string
    description: To pass multiple tracks, pass multiple comma-separated values, e.g. -F "playlist[tracks][][urn]=soundcloud:tracks:111,soundcloud:tracks:222"
  playlist[artwork_data]:
    title: The playlist artwork in binary format. Supported formats are gif, jpeg and png
    type: string
    format: binary
  playlist[ean]:
    type: string
  playlist[genre]:
    type: string
  playlist[label_name]:
    type: string
  playlist[license]:
    type: string
  playlist[permalink]:
    type: string
  playlist[permalink_url]:
    type: string
  playlist[purchase_title]:
    type: string
  playlist[purchase_url]:
    type: string
  playlist[release]:
    type: string
  playlist[release_date]:
    type: string
  playlist[set_type]:
    type: string
    enum:
      - album
      - playlist
  playlist[tag_list]:
    type: string
