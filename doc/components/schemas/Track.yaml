type: object
description: Soundcloud Track object.
properties:
  title:
    description: Track title.
    type: string
  artwork_url:
    description: URL to a JPEG image.
    type: string
  bpm:
    description: Tempo.
    type: integer
  comment_count:
    description: Number of comments.
    type: integer
  commentable:
    description: Is commentable.
    type: boolean
  created_at:
    description: Created timestamp.
    type: string
  description:
    description: Track description.
    type: string
  download_count:
    description: NUmber of downloads.
    type: integer
  downloadable:
    description: Is downloadable.
    type: string
  duration:
    description: Track duration.
    type: integer
  embeddable_by:
    deprecated: true
    description: Embeddable by.
    type: string
  favoritings_count:
    description: Number of favoritings.
    type: integer
  genre:
    description: Genre
    type: string
  urn:
    description: Track identifier.
    type: string
  isrc:
    description: ISRC code.
    type: string
  key_signature:
    description: Key signature.
    type: string
  kind:
    description: Type of object (track).
    type: string
  label_name:
    description: Label user name.
    type: string
  license:
    description: License
    type: string
  metadata_artist:
    description: Optional artist name, when different from user.
    type: string
  permalink_url:
    description: Permalink URL.
    type: string
  playback_count:
    description: Number of plays.
    type: integer
  purchase_title:
    description: Purchase title.
    type: string
  purchase_url:
    description: Purchase URL.
    type: string
  release:
    description: Release.
    type: string
  release_day:
    description: Day of release.
    type: integer
  release_month:
    description: Month of release.
    type: integer
  release_year:
    description: Year of release.
    type: integer
  sharing:
    description: Type of sharing (public/private).
    type: string
  stream_url:
    description: URL to stream (preview only)
    type: string
    deprecated: true
  streams_url:
    description: URL to get playable streams
    type: string
  streamable:
    description: Is streamable.
    type: boolean
  tag_list:
    description: Tags.
    type: string
  uri:
    description: Track URI.
    type: string
  user:
    allOf:
      - $ref: "#/components/schemas/User"
      - description: User who uploaded a track
  user_favorite:
    description: Is user's favourite. It is only set when fetching search results or single track, otherwise it is false.
    type: boolean
  user_playback_count:
    description: Number of plays by a user.
    type: integer
  waveform_url:
    description: Waveform URL.
    type: string
  available_country_codes:
    description: List of countries where track is available.
    type: string
  access:
    type: string
    nullable: true
    description: >
      Level of access the user (logged in or anonymous) has to the track.
        * `playable` - user is allowed to listen to a full track.
        * `preview` - user is allowed to preview a track, meaning a snippet is available
        * `blocked` - user can only see the metadata of a track, no streaming is possible
    enum:
      - playable
      - preview
      - blocked
  download_url:
    description: URL to download a track.
    type: string
  reposts_count:
    description: Number of reposts.
    type: integer
  secret_uri:
    description: Secret URL.
    type: string
