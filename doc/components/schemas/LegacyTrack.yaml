type: object
description: Soundcloud Track object.
properties:
  title:
    description: Track title.
    type: string
  artwork_url:
    description: URL to a JPEG image.
    type: string
  bpm:
    description: Tempo.
    type: integer
  comment_count:
    description: Number of comments.
    type: integer
  commentable:
    description: Is commentable.
    type: boolean
  created_at:
    description: Created timestamp.
    type: string
  description:
    description: Track description.
    type: string
  download_count:
    description: NUmber of downloads.
    type: integer
  downloadable:
    description: Is downloadable.
    type: string
  duration:
    description: Track duration.
    type: integer
  embeddable_by:
    deprecated: true
    description: Embeddable by.
    type: string
  favoritings_count:
    description: Number of favoritings.
    type: integer
  genre:
    description: Genre
    type: string
  id:
    description: Track identifier.
    type: integer
  isrc:
    description: ISRC code.
    type: string
  key_signature:
    description: Key signature.
    type: string
  kind:
    description: Type of object (track).
    type: string
  label_name:
    description: Label user name.
    type: string
  license:
    description: License
    type: string
  permalink_url:
    description: Permalink URL.
    type: string
  playback_count:
    description: Number of plays.
    type: integer
  purchase_title:
    description: Purchase title.
    type: string
  purchase_url:
    description: Purchase URL.
    type: string
  release:
    description: Release.
    type: string
  release_day:
    description: Day of release.
    type: integer
  release_month:
    description: Month of release.
    type: integer
  release_year:
    description: Year of release.
    type: integer
  sharing:
    description: Type of sharing (public/private).
    type: string
  stream_url:
    description: URL to stream.
    type: string
  streamable:
    description: Is streamable.
    type: boolean
  tag_list:
    description: Tags.
    type: string
  uri:
    description: Track URI.
    type: string
  user:
    description: User who uploaded a track
    $ref: "#/components/schemas/User"
  user_favorite:
    description: Is user's favourite.
    type: boolean
  user_playback_count:
    description: Number of plays by a user.
    type: integer
  waveform_url:
    description: Waveform URL.
    type: string
