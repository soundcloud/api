paths:
  /connect:
    get:
      summary: The OAuth2 authorization endpoint. Your app redirects a user to this endpoint, allowing them to delegate access to their account.
      tags:
        - oauth
      security:
        - ClientId: []
          AuthHeader: []
      parameters:
        - $ref: '#/components/parameters/client_id'
        - $ref: '#/components/parameters/redirect_uri'
        - $ref: '#/components/parameters/response_type'
      responses:
        200:
          description: Success
        401:
          description: 'Error: Unauthorized'
  /oauth2/token:
    post:
      summary: This endpoint accepts POST requests and is used to provision access tokens once a user has authorized your application.
      tags:
        - oauth
      security:
        - ClientId: []
      requestBody:
        description: OAׁuth payload.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/authorization_code'
                - $ref: '#/components/schemas/client_credentials'
                - $ref: '#/components/schemas/refresh_token'
                - $ref: '#/components/schemas/password'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                client_credentials:
                  $ref: "#/components/examples/ClientCredentials"
        400:
          description: 'Error: Bad Request'
          content:
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/ErrInvalidGrant"
        401:
          description: 'Error: Unauthorized'

