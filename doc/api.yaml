components:
  parameters:
    client_id:
      in: query
      name: client_id
      required: true
      schema:
        type: string
      description: client_id
    comment_id:
      in: path
      name: comment_id
      required: true
      schema:
        type: integer
      description: SoundCloud comment id
    connection_id:
      in: path
      name: connection_id
      required: true
      schema:
        type: integer
      description: SoundCloud connection id
    limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of results to return in the collection.
    follower_id:
      in: path
      name: follower_id
      required: true
      schema:
        type: integer
      description: SoundCloud User id to denote a Follower
    following_id:
      in: path
      name: following_id
      required: true
      schema:
        type: integer
      description: SoundCloud User id to denote a Following of a user
    playlist_id:
      in: path
      name: playlist_id
      required: true
      schema:
        type: integer
      description: SoundCloud playlist id
    q:
      in: query
      name: q
      required: true
      schema:
        type: string
      description: search
    redirect_uri:
      in: query
      name: redirect_uri
      required: true
      schema:
        type: string
      description: redirect_uri
    response_type:
      in: query
      name: response_type
      required: true
      schema:
        type: string
        enum:
          - code
          - token
          - code_and_token
      description: response type
    tag:
      in: path
      name: tag
      required: true
      schema:
        type: string
      description: tag
    track_id:
      in: path
      name: track_id
      required: true
      schema:
        type: integer
      description: SoundCloud Track id
    url:
      in: query
      name: url
      required: true
      schema:
        type: string
      description: SoundCloud URL
    user_id:
      in: path
      name: user_id
      required: true
      schema:
        type: integer
      description: SoundCloud User id
  securitySchemes:
    ClientId:
      in: query
      type: apiKey
      name: client_id
      description: Your product key. This is not the same as the API key used for most requests
    AuthHeader:
      in: header
      type: apiKey
      name: Authorization
      description: 'The string "OAuth" followed by the user’s token: OAuth ACCESS_TOKEN'
  schemas:
    authorization_code:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - client_credentials
        authorization_code:
          type: string
          description: Authorization code
        client_id:
          type: string
          description: Client ID
        redirect_uri:
          type: string
          description: Redirect URI
        client_secret:
          type: string
          description: Client secret
    client_credentials:
      allOf:
      - $ref: "#/components/schemas/authorization_code"
    refresh_token:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - refresh_token
        refresh_token:
          type: string
          description: Refresh token
        client_id:
          type: string
          description: Client ID
        redirect_uri:
          type: string
          description: Redirect URI
        client_secret:
          type: string
          description: Client secret
    password:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - password
        user_name:
          type: string
          description: User name
        password:
          type: string
          description: User password
        client_id:
          type: string
          description: Client ID
        redirect_uri:
          type: string
          description: Redirect URI
        client_secret:
          type: string
          description: Client secret
    UpdateTrackRequest:
      type: object
      properties:
        track:
          type: object
          properties:
            title:
              type: string
            permalink:
              type: string
            sharing:
              type: string
              enum:
                - public
                - private
              default: public
            embeddable_by:
              type: string
              enum:
                - all
                - me
                - none
              description: 'who can embed this track "all", "me", or "none"'
            purchase_url:
              type: string
            description:
              type: string
            genre:
              type: string
            tag_list:
              type: string
              description: "The tag_list property contains a list of tags separated by spaces. Multiword tags are quoted in doublequotes. We also support machine tags that follow the pattern NAMESPACE:KEY=VALUE. For example: geo:lat=43.555
                camel:size=medium
                “machine:tag=with space”
                Machine tags are not revealed to the user on the track pages."
            label_name:
              type: string
            release:
              type: string
            release_date:
              title: write only!
              type: string
              description: string, formatted as yyyy-mm-dd, representing release date
            streamable:
              type: boolean
              default: true
            downloadable:
              type: boolean
              default: true
            license:
              type: string
              enum:
                - no-rights-reserved
                - all-rights-reserved
                - cc-by
                - cc-by-nc
                - cc-by-nd
                - cc-by-sa
                - cc-by-nc-nd
                - cc-by-nc-sa
              description: 'Possible values: no-rights-reserved, all-rights-reserved, cc-by, cc-by-nc, cc-by-nd, cc-by-sa, cc-by-nc-nd, cc-by-nc-sa'
            commentable:
              type: boolean
              default: true
            isrc:
              type: string
            artwork_data:
              title: only for uploading, for PRO users
              type: string
            asset_data:
              title: Only for uploading
              type: string
    UserId:
      type: object
      properties:
        user_id:
          type: integer
