  /tracks/{track_id}:
    get:
      summary: Returns a track.
      tags:
        - tracks
      security:
        - ClientId: []
      parameters:
        - $ref: '#/components/parameters/track_id'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                default:
                  $ref: '#/components/examples/Track'
        401:
          description: 'Error: Unauthorized'
        404:
          description: 'Error: Not Found'
          content:
            application/json:
              examples:
                default:
                  $ref: '#/components/examples/Error404'
    put:
      summary: Updating a track information.
      tags:
        - tracks
      security:
        - AuthHeader: []
      parameters:
        - $ref: '#/components/parameters/track_id'
      requestBody:
        description: Track payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackRequest"
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                default:
                  $ref: '#/components/examples/Track'
        400:
          description: 'Error: Bad Request'
          content:
            application/json:
              examples:
                default:
                  $ref: '#/components/examples/Error400'
        401:
          description: 'Error: Unauthorized'
        404:
          description: 'Error: Not Found'
          content:
            application/json:
              examples:
                default:
                  $ref: '#/components/examples/Error404'
        500:
          description: 'Error: Internal Server Error'
