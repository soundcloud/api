  /tracks:
    get:
      summary: Performs a track search based on a query
      tags:
        - search
      security:
        - ClientId: []
          AuthHeader: []
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/ids"
        - $ref: "#/components/parameters/genres"
        - $ref: "#/components/parameters/tags"
        - $ref: "#/components/parameters/bpm_from"
        - $ref: "#/components/parameters/bpm_to"
        - $ref: "#/components/parameters/duration_from"
        - $ref: "#/components/parameters/duration_to"
        - $ref: "#/components/parameters/created_at_from"
        - $ref: "#/components/parameters/created_at_to"
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/Tracks"
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Uploads a new track.
      tags:
        - tracks
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/TrackDataRequest'
                  required:
                    - track[title]
                    - track[asset_data]
          multipart/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/TrackDataRequest'
                  required:
                    - track[title]
                    - track[asset_data]
      security:
        - ClientId: []
          AuthHeader: []
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                default:
                  $ref: '#/components/examples/Track'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
  /playlists:
    get:
      summary: Performs a playlist search based on a query
