components:
  parameters:
    bpm_from:
      in: query
      name: bpm[from]
      required: false
      schema:
        type: integer
      description: Return tracks with at least this bpm value
    bpm_to:
      in: query
      name: bpm[to]
      required: false
      schema:
        type: integer
      description: Return tracks with at most this bpm value
    client_id:
      in: query
      name: client_id
      required: true
      schema:
        type: string
      description: client_id
    created_at_from:
      in: query
      name: created_at[from]
      required: false
      schema:
        type: string
      description: (yyyy-mm-dd hh:mm:ss) return tracks created at this date or later
    created_at_to:
      in: query
      name: created_at[to]
      required: false
      schema:
        type: string
      description: (yyyy-mm-dd hh:mm:ss) return tracks created at this date or earlier
    duration_from:
      in: query
      name: duration[from]
      required: false
      schema:
        type: integer
      description: Return tracks with at least this duration value
    duration_to:
      in: query
      name: duration[to]
      required: false
      schema:
        type: integer
      description: Return tracks with at most this duration value
    genres:
      in: query
      name: genres
      required: false
      schema:
        type: string
      description: A comma separated list of genres
    ids:
      in: query
      name: ids
      required: false
      schema:
        type: string
      description: A comma separated list of track ids to filter on
    limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Number of results to return in the collection.
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
      description: Offset of first result
    q:
      in: query
      name: q
      required: true
      schema:
        type: string
      description: search
    redirect_uri:
      in: query
      name: redirect_uri
      required: true
      schema:
        type: string
      description: redirect_uri
    response_type:
      in: query
      name: response_type
      required: true
      schema:
        type: string
        enum:
          - code
          - token
          - code_and_token
      description: response type
    tags:
      in: query
      name: tags
      required: false
      schema:
        type: string
      description: A comma separated list of tags
    url:
      in: query
      name: url
      required: true
      schema:
        type: string
      description: SoundCloud URL
    # path #
    comment_id:
      in: path
      name: comment_id
      required: true
      schema:
        type: integer
      description: SoundCloud comment id
    connection_id:
      in: path
      name: connection_id
      required: true
      schema:
        type: integer
      description: SoundCloud connection id
    follower_id:
      in: path
      name: follower_id
      required: true
      schema:
        type: integer
      description: SoundCloud User id to denote a Follower
    following_id:
      in: path
      name: following_id
      required: true
      schema:
        type: integer
      description: SoundCloud User id to denote a Following of a user
    playlist_id:
      in: path
      name: playlist_id
      required: true
      schema:
        type: integer
      description: SoundCloud playlist id
    tag:
      in: path
      name: tag
      required: true
      schema:
        type: string
      description: tag
    track_id:
      in: path
      name: track_id
      required: true
      schema:
        type: integer
      description: SoundCloud Track id
    user_id:
      in: path
      name: user_id
      required: true
      schema:
        type: integer
      description: SoundCloud User id
  securitySchemes:
    ClientId:
      in: query
      type: apiKey
      name: client_id
      description: Your product key. This is not the same as the API key used for most requests
    AuthHeader:
      in: header
      type: apiKey
      name: Authorization
      description: 'The string "OAuth" followed by the user’s token: OAuth ACCESS_TOKEN'
  schemas:
    authorization_code:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - client_credentials
        authorization_code:
          type: string
          description: Authorization code
        client_id:
          type: string
          description: Client ID
        redirect_uri:
          type: string
          description: Redirect URI
        client_secret:
          type: string
          description: Client secret
    client_credentials:
      allOf:
      - $ref: "#/components/schemas/authorization_code"
    refresh_token:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - refresh_token
        refresh_token:
          type: string
          description: Refresh token
        client_id:
          type: string
          description: Client ID
        redirect_uri:
          type: string
          description: Redirect URI
        client_secret:
          type: string
          description: Client secret
    password:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - password
        user_name:
          type: string
          description: User name
        password:
          type: string
          description: User password
        client_id:
          type: string
          description: Client ID
        redirect_uri:
          type: string
          description: Redirect URI
        client_secret:
          type: string
          description: Client secret
    TrackMetadataRequest:
      type: object
      properties:
        track:
          type: object
          properties:
            title:
              type: string
            permalink:
              type: string
            sharing:
              type: string
              enum:
                - public
                - private
              default: public
            embeddable_by:
              type: string
              enum:
                - all
                - me
                - none
              description: 'who can embed this track "all", "me", or "none"'
            purchase_url:
              type: string
            description:
              type: string
            genre:
              type: string
            tag_list:
              type: string
              description: "The tag_list property contains a list of tags separated by spaces. Multiword tags are quoted in double quotes. We also support machine tags that follow the pattern NAMESPACE:KEY=VALUE. For example: geo:lat=43.555
                camel:size=medium
                “machine:tag=with space”
                Machine tags are not revealed to the user on the track pages."
            label_name:
              type: string
            release:
              type: string
            release_date:
              title: write only!
              type: string
              description: string, formatted as yyyy-mm-dd, representing release date
            streamable:
              type: boolean
              default: true
            downloadable:
              type: boolean
              default: true
            license:
              type: string
              enum:
                - no-rights-reserved
                - all-rights-reserved
                - cc-by
                - cc-by-nc
                - cc-by-nd
                - cc-by-sa
                - cc-by-nc-nd
                - cc-by-nc-sa
              description: 'Possible values: no-rights-reserved, all-rights-reserved, cc-by, cc-by-nc, cc-by-nd, cc-by-sa, cc-by-nc-nd, cc-by-nc-sa'
            commentable:
              type: boolean
              default: true
            isrc:
              type: string
    CreateUpdatePlaylistRequest:
      type: object
      properties:
        playlist:
          type: object
          properties:
            title:
              description: Title of the playlist
              type: string
            description:
              description: Description of the playlist
              type: string
            sharing:
              description: public or private
              type: string
              enum:
                - public
                - private
            tracks:
              description: List of tracks to add to playlist
              type: array
              items:
                type: object
                required:
                  - id
                properties:
                  id: 
                    description: SoundCloud track id
                    type: string
    TrackDataRequest:
      type: object
      properties:
        track[title]:
          type: string
        track[asset_data]:
          title: Only for uploading
          type: string
          format: binary
        track[permalink]:
          type: string
        track[sharing]:
          type: string
          enum:
            - public
            - private
          default: public
        track[embeddable_by]:
          type: string
          enum:
            - all
            - me
            - none
          description: 'who can embed this track "all", "me", or "none"'
        track[purchase_url]:
          type: string
        track[description]:
          type: string
        track[genre]:
          type: string
        track[tag_list]:
          type: string
          description: "The tag_list property contains a list of tags separated by spaces. Multiword tags are quoted in double quotes. We also support machine tags that follow the pattern NAMESPACE:KEY=VALUE. For example: geo:lat=43.555
                camel:size=medium
                “machine:tag=with space”
                Machine tags are not revealed to the user on the track pages."
        track[label_name]:
          type: string
        track[release]:
          type: string
        track[release_date]:
          title: write only!
          type: string
          description: string, formatted as yyyy-mm-dd, representing release date
        track[streamable]:
          type: boolean
          default: true
        track[downloadable]:
          type: boolean
          default: true
        track[license]:
          type: string
          enum:
            - no-rights-reserved
            - all-rights-reserved
            - cc-by
            - cc-by-nc
            - cc-by-nd
            - cc-by-sa
            - cc-by-nc-nd
            - cc-by-nc-sa
          description: 'Possible values: no-rights-reserved, all-rights-reserved, cc-by, cc-by-nc, cc-by-nd, cc-by-sa, cc-by-nc-nd, cc-by-nc-sa'
        track[commentable]:
          type: boolean
          default: true
        track[isrc]:
          type: string
        track[artwork_data]:
          title: Only for uploading, for PRO users
          type: string
          format: binary
    UserId:
      type: object
      properties:
        user_id:
          type: integer
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        link:
          type: string
        error:
          type: string
          deprecated: true
        errors:
          type: object
          deprecated: true
        status:
          type: string
          deprecated: true
    ErrorInvalidGrant:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            message:
              type: string
              enum: [invalid_request, unsupported_grant_type, invalid_grant]
    TooManyRequests:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            spam_warning_urn:
              type: string
