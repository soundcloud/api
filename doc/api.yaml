        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Deletes a playlist.
      tags:
        - playlists
      security:
        - ClientId: []
          AuthHeader: []
      parameters:
        - $ref: "#/components/parameters/playlist_id"
      responses:
        202:
          $ref: '#/components/responses/Accepted'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
  /playlists/{playlist_id}/tracks:
