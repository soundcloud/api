        401:
          $ref: '#/components/responses/Unauthorized'
  /me/followings/tracks:
    get:
      summary: Returns a list of recent tracks from users followed by the authenticated user.
      tags:
        - me
      security:
        - AuthHeader: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/Tracks"
        401:
          $ref: '#/components/responses/Unauthorized'
  /me/followings/{user_id}:
    get:
      summary: Returns a user who is followed by the authenticated user. (use /users/{user_id} instead, to fetch the user details)
      deprecated: true
      tags:
        - me
      security:
        - AuthHeader: []
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                default:
                  $ref: "#/components/examples/User"
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    put:
      summary: Follows a user.
      tags:
        - me
      security:
        - AuthHeader: []
      parameters:
        - $ref: '#/components/parameters/user_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserId'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                200:
                  $ref: '#/components/examples/OK'
                201:
                  $ref: '#/components/examples/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
    # post:
    #   summary: Endpoint to follow another user.
    #   tags:
    #     - me
    #   security:
    #     - AuthHeader: []
    #   parameters:
    #     - $ref: '#/components/parameters/user_id'
    #   responses:
    #     201:
    #       description: Success
    #       content:
    #         application/json:
    #           examples:
    #             200:
    #               $ref: '#/components/examples/OK'
    #             201:
    #               $ref: '#/components/examples/User'
    #     404:
    #     500:
    #       description: Internal Server Error
    delete:
      summary: Deletes a user who is followed by the authenticated user.
      tags:
        - me
      security:
        - AuthHeader: []
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        200:
          description: Success
          content:
            application/json:
              examples:
                200:
                  $ref: '#/components/examples/OK'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
