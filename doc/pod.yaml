containers:
- name: {{ component }}
  image: {{ image }}
  command: {{ cmd }}
  env:
  - name: ZONE
    value: "{{ zone }}"
  ports:
  - name: http
    containerPort: 80
  readinessProbe:
    httpGet:
      port: 80
      path: /
    initialDelaySeconds: 30
    timeoutSeconds: 1
  livenessProbe:
    httpGet:
      port: 80
      path: /
    initialDelaySeconds: 1800
    timeoutSeconds: 1
  resources:
    requests:
      cpu: 0.1
      memory: 20Mi
    limits:
      memory: 200Mi
